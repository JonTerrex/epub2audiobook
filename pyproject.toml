[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "ftfy>=6.3.1",
    "num2words>=0.5.14",
    "pydantic>=2.13.5",
    "spacy>=3.8.16",
]

[project.scripts]
epub2audiobook = "epub2audiobook:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
